name: Release

on:
  push:
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches package version
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build project
        run: npm run build
      - name: Copy artifacts to remote server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          strip_components: 1
          overwrite: true
          source: "dist/"
          target: ${{ secrets.UI_TARGET_PATH }}${{ github.ref_name }}/
