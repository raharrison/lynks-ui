<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" href="/favicon.ico" sizes="32x32"/>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"/>
    <meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Self-hosted link, note and knowledge manager"/>
    <title>Lynks</title>
    <!-- Set the theme before React mounts, so a dark session does not flash white -->
    <script>
        (function () {
            try {
                const mode = (JSON.parse(localStorage.getItem("lynks-theme") || "{}").state || {}).mode || "system";
                const dark = mode === "dark" ||
                    (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
            } catch (_) {
            }
        })();
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
