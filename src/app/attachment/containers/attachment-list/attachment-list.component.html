<lks-loader [loadingStatus]="loadingStatus" [small]="true" entity="attachments">
  <div *ngIf="loadingStatus == 'loaded' && attachments?.length == 0">
    <p class="total-attachments">No attachments found</p>
  </div>
  <div *ngIf="loadingStatus == 'loaded' && attachments?.length > 0">
    <table class="table table-striped table-hover">
      <thead>
      <tr>
        <th scope="col" style="width: 25%">Name</th>
        <th scope="col" style="width: 10%">Version</th>
        <th scope="col" style="width: 15%">Type</th>
        <th scope="col" style="width: 10%">Size</th>
        <th scope="col" style="width: 20%">Created</th>
        <th scope="col" style="width: 20%">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr class="attachment-item cursor-pointer"
          [routerLink]="['attachment', attachment.id]"
          [ngClass]="{'table-primary': currentVersions[attachment.parentId] !== attachment.version}"
          *ngFor="let attachment of filteredAttachments"
          lks-attachment-list-item [entryId]="entryId" [attachment]="attachment"
          (attachmentModified)="retrieveAttachments()">
      </tr>
      </tbody>
    </table>
    <div class="form-check form-switch">
      <input [(ngModel)]="showVersions" [ngModelOptions]="{standalone: true}" (change)="filterAttachments()"
             class="form-check-input" type="checkbox" role="switch" id="showVersionsCheckbox">
      <label class="form-check-label" for="showVersionsCheckbox">
        Show versions
      </label>
    </div>
  </div>
</lks-loader>

<lks-attachment-upload [entryId]="entryId" (attachmentUploaded)="retrieveAttachments()"></lks-attachment-upload>
