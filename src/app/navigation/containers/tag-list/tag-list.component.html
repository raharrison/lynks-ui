<a [routerLink]="undefined" class="nav-link cursor-pointer" (click)="expanded = !expanded" [ngClass]="{collapsed: !expanded, active: expanded}">
  <div class="lks-nav-link-icon">
    <i class="fa-solid fa-tags"></i>
  </div>
  Tags
  <div class="lks-sidenav-collapse-arrow">
    <i class="ms-auto fa-solid fa-angle-down"></i>
  </div>
</a>

<nav class="lks-sidenav-menu-nested nav" [ngClass]="{'d-none': !expanded}">
  <tree-root #tree [nodes]="tags" (activate)="onTagSelected($event.node.data)" (updateData)="onTreeLoaded()"></tree-root>
</nav>
